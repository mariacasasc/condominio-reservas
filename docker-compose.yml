services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-condominio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-condominio}
      POSTGRES_DB: ${POSTGRES_DB:-condominio_reservas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - condominio_reservas_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-condominio} -d ${POSTGRES_DB:-condominio_reservas}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  condominio_reservas_db:
